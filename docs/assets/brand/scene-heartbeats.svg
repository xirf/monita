<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" aria-label="Moni hears a scheduled job ping on time" role="img" viewBox="0 0 560 200"><style>@keyframes monita-blink{0%,94%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes monita-beat{0%{opacity:1}50%{opacity:.35}}@keyframes monita-bounce{0%{transform:translateY(0)}50%{transform:translateY(-22px)}}@keyframes monita-rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}}@keyframes monita-sway{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><marker id="heartbeats-arrow-brand" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1L9 5L1 9" style="stroke:var(--art-primary,#c4258f)"/></marker><marker id="heartbeats-arrow-up" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1L9 5L1 9" style="stroke:var(--art-up,#23784e)"/></marker></defs><line x1="0" x2="560" y1="180.75" y2="180.75" stroke-width="1.5" style="stroke:var(--art-input,#c9cbce)"/><g><rect width="232" height="116" x="24" y="64" stroke-width="1.5" rx="12" style="fill:var(--art-card,#ffffff);stroke:var(--art-input,#c9cbce)"/><line x1="24" x2="256" y1="88" y2="88" stroke-width="1.5" style="stroke:var(--art-input,#c9cbce)"/><circle cx="40" cy="76" r="3.5" style="fill:var(--art-input,#c9cbce)"/><circle cx="52" cy="76" r="3.5" style="fill:var(--art-input,#c9cbce)"/><circle cx="64" cy="76" r="3.5" style="fill:var(--art-input,#c9cbce)"/><rect width="100" height="8" x="80" y="72" rx="4" style="fill:var(--art-input,#c9cbce)"/><text x="40" y="114" style="fill:var(--art-muted-foreground,#7a7f87);font-family:'Geist Mono',ui-monospace,m